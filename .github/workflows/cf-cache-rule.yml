name: cf-cache-rule

# 一次性运维任务(手动触发,幂等可重跑):为 status.aetherstudio.top 建边缘缓存
# Cache Rule。Rulesets API 拒绝 OAuth 认证方案,只能用 API Token——token 存于
# GitHub Secrets,只在 GitHub 托管 runner 上注入,不落本地与自托管机器。
# 动作 SHA 与 deploy.yml 一致钉死。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-rule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
      - name: Ensure zc-status edge cache rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cf-cache-rule.mjs
